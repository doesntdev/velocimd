[package]
name = "velocimd"
version = "0.1.1"
edition = "2024"
description = "A lightning-fast Markdown reader and editor written in Rust."
license = "AGPL-3.0-only"
authors = ["Logan Hart"]
repository = "https://github.com/doesntdev/velocimd"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
eframe = { version = "0.34", default-features = true }
egui_commonmark = { version = "0.23", default-features = false, features = ["better_syntax_highlighting", "load-images", "svg"] }
egui_extras = { version = "0.34", features = ["image", "file", "svg"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
once_cell = "1.21.4"
pulldown-cmark = "0.13"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
native-dialog = "0.9.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dev-dependencies]
insta = "1.43"
