name: Release Packages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check repair branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  package:
    name: Package ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact-name: velocimd-linux
          - name: macos
            os: macos-latest
            artifact-name: velocimd-macos
          - name: windows
            os: windows-latest
            artifact-name: velocimd-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config
      - name: Install Windows packaging dependencies
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Test
        run: cargo test --locked
      - name: Package macOS universal
        if: runner.os == 'macOS'
        run: scripts/package-macos-universal.sh
      - name: Package
        if: runner.os != 'macOS'
        run: cargo packager --release
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Assemble complete release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: velocimd-*
          path: release-assets
          merge-multiple: true
      - name: Verify versions, complete asset set and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag/Cargo version mismatch'
          assert tomllib.loads(Path('Packager.toml').read_text())['version'] == version, 'Packager version mismatch'
          expected = {
              'PKGBUILD', f'velocimd_{version}_amd64.deb',
              f'Velocimd_{version}_universal.dmg', f'velocimd_{version}_x64-setup.exe',
              f'velocimd_{version}_x86_64.AppImage', f'velocimd_{version}_x86_64.tar.gz',
          }
          folder = Path('release-assets')
          actual = {p.name for p in folder.iterdir() if p.is_file()}
          assert actual == expected, f'Wrong asset set: missing={expected-actual}, extra={actual-expected}'
          checksums = []
          for name in sorted(expected):
              path = folder / name
              assert path.stat().st_size > 0, f'Empty asset: {name}'
              with path.open('rb') as file:
                  digest = hashlib.file_digest(file, 'sha256').hexdigest()
              checksums.append(f'{digest}  {name}\n')
          (folder / 'SHA256SUMS').write_text(''.join(checksums))
          print('Verified all six package assets for', version)
          PY
      - name: Prepare draft release for final verification
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true
